# Gozjaro Base Packages (LFS 13.1-rc2 equivalent)
# Core packages required for a minimal working system.

packages:
  - name: acl
    version: "2.4.0"
    category: base
    source:
      url: https://download.savannah.gnu.org/releases/acl/acl-2.4.0.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --disable-static
      install_check: getfacl --version
    dependencies:
      - attr

  - name: attr
    version: "2.6.0"
    category: base
    source:
      url: https://download.savannah.gnu.org/releases/attr/attr-2.6.0.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --disable-static
      install_check: getfattr --version
    dependencies: []

  - name: autoconf
    version: "2.78"
    category: base
    source:
      url: https://ftpmirror.gnu.org/autoconf/autoconf-2.73.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
      install_check: autoconf --version
    dependencies: []

  - name: automake
    version: "1.18.1"
    category: base
    source:
      url: https://ftpmirror.gnu.org/automake/automake-1.18.1.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --docdir=/usr/share/doc/automake-1.17
      install_check: automake --version
    dependencies:
      - perl

  - name: bash
    version: "5.3"
    category: base
    source:
      url: https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --without-bash-malloc
        - --with-installed-readline
        - --docdir=/usr/share/doc/bash-5.3
      install_check: bash --version
    dependencies:
      - readline
      - ncurses

  - name: bc
    version: "7.0.3"
    category: base
    source:
      url: https://github.com/gavinhoward/bc/releases/download/7.0.3/bc-7.0.3.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - CC=gcc
        - --prefix=/usr
        - -G
        - -O3
        - -r
      install_check: bc --version
    dependencies: []

  - name: binutils
