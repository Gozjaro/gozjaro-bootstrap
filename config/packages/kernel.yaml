# Gozjaro Kernel Packages
# Kernel source and firmware definitions.
# Version is managed separately in stages/80-kernel.sh for flexibility.

packages:
  - name: linux
    version: "7.1.3"
    category: kernel
    source:
      url: https://mirrors.tuna.tsinghua.edu.cn/kernel/v7.x/linux-7.1.3.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: custom
    dependencies: []

  - name: linux-firmware
    version: "20250306"
    category: kernel
    source:
      url: https://mirrors.tuna.tsinghua.edu.cn/kernel/firmware/linux-firmware-20250306.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: make
    dependencies: []